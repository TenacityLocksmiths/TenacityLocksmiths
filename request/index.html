<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tenacity Locksmiths – Request Service</title>
  <meta name="theme-color" content="#1e3a8a" />
  <style>
    :root {
      --blue: #1e3a8a;
      --blue-dark: #1e40af;
      --bg: #f1f5f9;
      --white: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --error: #dc2626;
      --success: #16a34a;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--white);
    }
    .header {
      background: var(--blue);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 44px; height: 44px;
      background: white; color: var(--blue);
      font-weight: 800; font-size: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
    }
    .brand { font-weight: 700; font-size: 1.05rem; }
    .tagline { font-size: 0.8rem; opacity: 0.9; margin-top: 2px; }
    .progress-container { height: 4px; background: #e2e8f0; }
    .progress-bar { height: 100%; background: #3b82f6; width: 25%; transition: width 0.3s; }
    .main { flex: 1; padding: 24px 20px 40px; }
    .step { display: none; }
    .step.active { display: block; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--text-light); font-size: 0.95rem; margin-bottom: 22px; }
    .option-group { margin-bottom: 24px; }
    .group-title {
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-light); margin-bottom: 10px;
    }
    .option-btn {
      width: 100%; padding: 16px 18px;
      background: var(--white); border: 2px solid var(--border);
      border-radius: var(--radius); margin-bottom: 10px;
      font-size: 1.05rem; font-weight: 500; color: var(--text);
      cursor: pointer; text-align: center;
    }
    .option-btn:active { border-color: var(--blue); background: #eff6ff; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 7px; }
    .required { color: var(--error); }
    .optional { font-weight: 400; color: var(--text-light); font-size: 0.85rem; }
    input, textarea {
      width: 100%; padding: 14px 16px;
      border: 2px solid var(--border); border-radius: 10px;
      font-size: 1rem; font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--blue); }
    .error-msg { color: var(--error); font-size: 0.85rem; margin-top: 5px; display: none; }
    .error-msg.show { display: block; }
    .radio-group { display: flex; flex-direction: column; gap: 10px; }
    .radio-card {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px; border: 2px solid var(--border);
      border-radius: var(--radius); cursor: pointer;
    }
    .radio-card.selected { border-color: var(--blue); background: #eff6ff; }
    .radio-title { font-weight: 600; font-size: 1.05rem; }
    .radio-desc { font-size: 0.85rem; color: var(--text-light); }
    .nav-buttons { display: flex; gap: 12px; margin-top: 26px; }
    .btn {
      flex: 1; padding: 15px 18px; border-radius: 10px;
      font-size: 1.05rem; font-weight: 600; border: none; cursor: pointer;
    }
    .btn-primary { background: var(--blue); color: white; }
    .btn-primary:disabled { background: #94a3b8; }
    .btn-secondary { background: var(--bg); color: var(--text); border: 2px solid var(--border); }
    .success-icon {
      width: 70px; height: 70px; background: #dcfce7; color: var(--success);
      font-size: 2rem; font-weight: 700; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 10px auto 18px;
    }
    .success-text { text-align: center; color: var(--text-light); margin-bottom: 20px; }
    .summary-box { background: var(--bg); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; font-size: 0.95rem; }
    .summary-box div { margin-bottom: 6px; }
    .success-note { text-align: center; font-size: 0.9rem; color: var(--text-light); }
    .footer {
      text-align: center; padding: 14px; font-size: 0.85rem;
      color: var(--text-light); border-top: 1px solid var(--border);
    }
    .footer a { color: var(--blue); font-weight: 600; text-decoration: none; }
  </style>
</head>

        <div class="brand">TENACITY LOCKSMITHS</div>
        <div class="tagline">Automotive Specialist · Mobile Service</div>
      </div>
    </header>

      <div class="progress-bar" id="progressBar"></div>
    </div>
